# Решения: общие правила секции «Решения» у раздела, этапа, вехи, проекта и
# сферы — что считать решением, форма блока, замена, куда идёт решение. Часть
# skill, без хука. Решение не сущность: тега и шаблона у него нет, data/entity.json
# нет. Читать его велят скиллы сущностей, у чьих страниц есть «Решения».
# data/review-criterion.md — общая проверка решений для ревью хода, поэтому
# `for` только у ревью.
slug = "craft-decisions"
for = ["turn-review"]
# Механику вызовов и общие правила записи берёт из craft-call, форму разговора —
# из behavior, сверку решений, стоявших на заменённом, — из craft-reconcile.
requires = ["craft-call", "behavior", "craft-reconcile"]
