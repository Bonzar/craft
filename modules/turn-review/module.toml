# Ревью хода: на остановке хода хук не отпускает ход, пока подагент не дал
# вердикт по всему, что ход записал в Craft. Смысловой дефект записи виден
# только целиком, в конце хода, — поэтому ревью стоит на остановке.
slug = "turn-review"
# prompt берёт номер хода. post-tool здесь только разбирает ответ на
# собственный вопрос ревью. after-compact обнуляет счёт поручений: правила
# ревью после сжатия из контекста ушли. model-message прячет ответ до чистого
# вердикта и дописывает к нему временный отладочный вывод.
events = ["stop", "post-tool", "prompt", "after-compact", "model-message"]
# Модуль ставится в любой харнес. Обёртка Codex из этих событий переводит
# только «после сжатия» (SessionStart с source=compact); остановку хода,
# вызовы, реплику и показ ответа она не знает, установщик об этом
# предупреждает, как у замка craft-type-lock.
# Объём копят поставщики review-craft-calls, review-prompts и craft-session-anchor
# через lib этого модуля, поэтому они требуют turn-review, а не он их. Модули
# критериев его не требуют: их файлы ревью находит в каталоге модулей. Нет
# ни одного поставщика — остановка не отпускает ход и называет это.
requires = []
