# Ревью хода: на остановке хода хук не отпускает ход, пока подагент не дал
# вердикт по всему, что ход записал в Craft. Смысловой дефект записи виден
# только целиком, в конце хода, — поэтому ревью стоит на остановке.
slug = "turn-review"
# prompt связывает id реплики с номером хода. post-tool здесь только разбирает
# ответ на собственный вопрос ревью. after-compact обнуляет счёт поручений:
# правила ревью после сжатия из контекста ушли. model-message прячет ответ до
# чистого вердикта и дописывает к нему временный отладочный вывод.
events = ["stop", "post-tool", "prompt", "after-compact", "model-message"]
# Модуль ставится в любой харнес. Обёртка Codex из этих событий переводит
# только «после сжатия» (SessionStart с source=compact); остановку хода,
# вызовы, реплику и показ ответа она не знает, установщик об этом
# предупреждает, как у замка craft-type-lock.
# Поставщиков ревью находит по их `for = ["turn-review"]`, а не по requires:
# они пишут объём сами, по контракту из README, и ни ревью их, ни они ревью не
# требуют. Нет ни одного поставщика — остановка не отпускает ход и называет
# это. Тип каждой записи кладёт в объём замок craft-type-lock строкой
# `entity`: своего разбора команд у ревью нет, и requires пуст. Нет строки —
# критерии всех сущностей.
