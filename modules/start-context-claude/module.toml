# База стартового контекста для Claude. Стоит на старте сессии и после сжатия,
# существует только у Claude и ставится копиями: вывод хука Claude режет на
# 10 000 знаков на процесс, поэтому длинный контекст едет цепочкой копий, а не
# одной строкой.
#
# Копий 16, а не 12, как в записях: замер 17.09.2026 — снимок Craft вместе с
# пробой занимает 127 962 знака, это 13 кусков по 9 900, и на двенадцати копиях
# хвост (вся проба и ~9 000 знаков памяти) обрезался бы. 16 копий дают 158 400
# знаков, то есть около четверти запаса на рост базы. Число — решение Влада:
# оно правится одной строкой здесь, установщик берёт его из шапки.
#
# Поставщиков в шапке нет и быть не может: база ищет их по `for` соседей.
slug = "start-context-claude"
events = ["session-start", "after-compact"]
harness = "claude"
copies = 16
