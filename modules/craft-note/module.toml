# Заметка и тема: скилл типа сущности для тегов #заметка и #тема. Часть skill,
# без хука: правила живут разделами Craft, скилл ведёт по ним агента при
# записи. Модуль craft-type-lock не пропускает запись без скилла и шаблона.
slug = "craft-note"
for = ["craft-type-lock", "turn-review"]
# Механику вызовов и общие правила записи берёт из craft-call, форму разговора —
# из behavior, сверку перед записью — из craft-reconcile.
requires = ["craft-call", "behavior", "craft-reconcile"]
