# Поставщик данных ревью для Craft: пишет в объём ревью запись и чтение
# Craft MCP и вызовы скиллов. Сущностей и тегов не знает: команду записи кладёт
# как есть, теги в ней ищет само ревью. Строки пишет по контракту из README
# turn-review, формат своих записей описывает в data/review-records.md.
slug = "review-craft-calls"
for = ["turn-review"]
events = ["post-tool"]
# Ревью он не требует: объём дописывается механизмом хранилища ядра. Разбор
# имени инструмента Craft, команды и id блоков чтения — у command-tree-craft.
requires = ["command-tree-craft"]
