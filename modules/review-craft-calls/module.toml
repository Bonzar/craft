# Поставщик данных ревью для Craft: пишет в объём ревью запись и чтение
# Craft MCP и вызовы скиллов. Сущностей не знает: теги типа в
# команде записи он помечает по данным модулей сущностей, чтобы критерии
# нашли свои записи. Формат своих записей описывает в data/review-records.md.
slug = "review-craft-calls"
for = ["turn-review"]
events = ["post-tool"]
# Объём и его форма — у ревью хода; разбор команды Craft и поиск тегов в ней —
# у command-tree-craft. Набор тегов поставщик собирает сам по data/entity.json.
requires = ["turn-review", "command-tree-craft"]
