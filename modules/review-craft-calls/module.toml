# Поставщик данных ревью для Craft: пишет в объём ревью каждый вызов Craft
# MCP, запись, чтение, и вызовы скиллов. Сущностей не знает: теги типа в
# команде записи он помечает по данным модулей сущностей, чтобы критерии
# нашли свои записи. Формат своих записей описывает в data/review-records.md.
slug = "review-craft-calls"
events = ["post-tool"]
# Объём и его форма — у ревью хода; разбор тегов в команде — у замка типов.
requires = ["turn-review", "craft-type-lock"]
