# Модуль свежести окружения: на старте сессии сверяет набор модулей с
# удалённым по коммитам в его файлы. Одна часть — хук.
#
# Поля harness нет: база нужна каждому харнесу. Установленная копия в любом
# окружении только предупреждает, что набор отстал. Переустанавливает набор
# только адаптер облачного Claude — копия из чекаута, которую зовёт строка в
# `.claude/settings.json` репозитория.
#
# Только `session-start`. После сжатия набор тот же, и второй заход ничего бы не
# изменил: событие `after-compact` приходит той же строкой хука Claude, и
# обёртка на нём молчит сама.
slug = "env-refresh"
events = ["session-start"]
requires = []
