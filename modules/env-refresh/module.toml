# Модуль свежести окружения: догоняет набор модулей до актуального main на
# старте сессии. Одна часть — хук.
#
# `harness = "claude"` — кеш облачного окружения это особенность Claude Code on
# the web; в Codex такой сессии нет, и молчащая копия там ни к чему.
#
# Только `session-start`. После сжатия набор уже новый, и второй заход ничего
# бы не изменил: событие `after-compact` приходит той же строкой хука Claude, и
# обёртка на нём молчит сама.
slug = "env-refresh"
events = ["session-start"]
harness = "claude"
requires = []
