# Снимок памяти агента и её актуализация. Часть lib — поставщик стартового
# контекста: служит любой базе семейства start-context и своего хука не имеет —
# хуки одного события идут параллельно, и база обгоняла бы поставщика. Часть
# skill — актуализация памяти: тот же модуль, что память подставляет, её и
# обновляет. data/review.md — требования этого скилла к ходу для ревью хода.
slug = "craft-snapshot"
for = ["start-context-*"]
# craft-sync — чтение и детект изменений, craft-call — механика записи в Craft.
requires = ["craft-sync", "craft-call"]
