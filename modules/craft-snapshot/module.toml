# Поставщик стартового контекста: снимок базы Craft. Служит любой базе
# семейства start-context и своего хука не имеет — хуки одного события идут
# параллельно, и база обгоняла бы поставщика. Часть lib: базе нужна функция.
slug = "craft-snapshot"
for = ["start-context-*"]
requires = ["craft-sync"]
