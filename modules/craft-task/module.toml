# Скилл типа «задача». Часть skill, без хука: скилл ведёт запись задачи, а
# правила типа живут разделами Craft. Замок craft-type-lock требует его вызова
# и чтения шаблона задачи перед любой записью в задачу.
slug = "craft-task"
for = ["craft-type-lock", "turn-review"]
# Механику вызовов и общие правила записи берёт из craft-call, форму разговора —
# из behavior, сверку перед записью — из craft-reconcile, связи «Зависит от» и
# «Следующий шаг» — из craft-links, проверку чекбоксов и тегов — из craft-sync.
requires = ["craft-call", "behavior", "craft-reconcile", "craft-links", "craft-sync"]
