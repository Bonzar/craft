# Поставщик данных ревью для чата: пишет в объём ревью каждую реплику Влада
# (пустые не пишутся) и каждый его ответ на вопрос кнопками, с авторством и
# временем. Значений у реплик нет, это сырьё: ревью судит по нему само.
# Строки пишет по контракту из README turn-review, формат — data/review-records.md.
slug = "review-prompts"
for = ["turn-review"]
events = ["prompt", "post-tool"]
# Ревью он не требует: объём дописывается механизмом хранилища ядра.
requires = []
