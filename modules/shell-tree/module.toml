# Разбор командной строки оболочки и ответ «пишет ли команда и куда». Модуль
# самодостаточен: исходники разбора в `src/`, данные предиката в `data/`, а
# бинарник он собирает сам хуком на старте сессии в `bin/` — в setup-скрипте
# окружения о нём ни строки, нужен только Go на PATH. Часть lib: parse и
# verdict; их зовут по slug из requires замки оболочки. Харнес не задан:
# сборка одинакова везде.
slug = "shell-tree"
events = ["session-start"]
