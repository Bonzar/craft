# Модуль, раскладывающий вход Codex на старте сессии. Одна часть — хук: ставить
# нечего, кроме файла, и делается это ровно один раз за сессию.
#
# `harness = "claude"` — вход раскладывает та сессия, которая сейчас идёт, а идёт
# она в Claude. Codex своего входа себе не раскладывает: он им уже пользуется.
#
# Только `session-start`. После сжатия файл уже лежит, и второй заход ничего бы
# не изменил: событие `after-compact` приходит той же строкой хука Claude, и
# обёртка на нём молчит сама.
slug = "codex-login"
events = ["session-start"]
harness = "claude"
requires = []
