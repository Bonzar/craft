# Замок «запись в сущность без её скилла и шаблона»: запись в Craft проходит,
# только когда в этом ходе вызван скилл типа сущности и прочитан её шаблон —
# по тегу типа в тексте записи и по тегу ближайшего владельца места с типом
# (страницы или блока выше по отступу). Модули сущностей объявляют себя полем
# `for = ["craft-type-lock"]` и несут data/entity.json с тегами и шаблонами:
# замок находит их ядром и чужих модулей не правит. Владельца узнаёт по
# дереву из прочитанного в сессии, а чего там нет — через connect-API. Ход
# считает сам: реплика открывает новый, сжатие сбрасывает счёт и дерево.
slug = "craft-type-lock"
# Поставщик записей ревью хода: на каждой записи в Craft кладёт в объём
# строку `entity` с типом места записи, по контракту из README turn-review.
# Ревью замок не требует и его lib не импортирует.
for = ["turn-review"]
events = ["pre-tool", "post-tool", "prompt", "after-compact"]
# Команду Craft — теги, id, цели записи — разбирает lib command-tree-craft.
# Модули сущностей в requires не стоят: они приходят сами через `for`, а без
# них замку требовать нечего.
requires = ["command-tree-craft"]
