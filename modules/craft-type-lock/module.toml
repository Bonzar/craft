# Замок «запись в тип сущности без его скилла»: запись в Craft с тегом типа
# проходит, только когда в этом ходе вызван скилл этого типа. Ход считает
# сам: реплика открывает новый, сжатие сбрасывает счёт.
slug = "craft-type-lock"
events = ["pre-tool", "post-tool", "prompt", "after-compact"]
# Без скиллов типов замок запрещал бы запись навсегда: вызвать нечего. Пока
# их нет, библиотека сама молчит за замок и говорит в чат, чего не хватает.
requires = ["craft-task", "craft-stage", "craft-section", "craft-note"]
