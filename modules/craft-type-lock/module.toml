# Замок «запись в сущность без её скилла и шаблона»: запись в Craft проходит,
# только когда в этом ходе вызван скилл типа сущности и прочитан её шаблон —
# по тегу типа в тексте записи и по тегу в заголовке страницы, куда запись
# ложится. Модули сущностей объявляют себя полем `for = ["craft-type-lock"]` и
# несут data/entity.json с тегами и шаблонами: замок находит их ядром и
# чужих модулей не правит. Страницу цели узнаёт через connect-API. Ход
# считает сам: реплика открывает новый, сжатие сбрасывает счёт.
slug = "craft-type-lock"
events = ["pre-tool", "post-tool", "prompt", "after-compact"]
# Команду Craft — теги, id, цели записи — разбирает lib command-tree-craft.
# Модули сущностей в requires не стоят: они приходят сами через `for`, а без
# них замку требовать нечего.
requires = ["command-tree-craft"]
