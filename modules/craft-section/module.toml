# Раздел: скилл типа сущности для тега #раздел. Часть skill, без хука: правила
# живут разделами Craft, скилл ведёт по ним агента в момент записи, а пропуск
# записи без скилла ловит проверка craft-type-lock.
slug = "craft-section"
for = ["craft-type-lock", "turn-review"]
# Механику вызовов и общие правила записи берёт из craft-call, форму разговора —
# из behavior, сверку перед записью — из craft-reconcile.
requires = ["craft-call", "behavior", "craft-reconcile"]
