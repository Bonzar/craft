# Этап и веха проекта: скилл типа сущности для тегов #этап и #веха. Часть
# skill, без хука: правила живут разделами Craft, скилл ведёт по ним агента в
# момент записи, а запись без скилла и шаблона отклоняет craft-type-lock.
slug = "craft-stage"
for = ["craft-type-lock", "turn-review"]
# Механику вызовов и общие правила записи берёт из craft-call, форму разговора —
# из behavior, сверку перед записью — из craft-reconcile, общие правила
# «Решений» — из craft-decisions, связи «Зависит от» и «Следующий шаг» — из
# craft-links. Проверка чекбоксов и тегов — в craft-task.
requires = ["craft-call", "behavior", "craft-reconcile", "craft-decisions", "craft-links", "craft-task"]
