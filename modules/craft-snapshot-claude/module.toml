# Парный к craft-snapshot модуль только для Claude: скилл, который заводит
# ночную рутину актуализации памяти в облаке. Рутины в облаке умеет заводить
# только облачный Claude Code, поэтому модуль существует лишь для Claude. Без
# хуков, одна часть skill.
slug = "craft-snapshot-claude"
harness = "claude"
# Рутина зовёт скилл актуализации из craft-snapshot: без него звать нечего.
requires = ["craft-snapshot"]
