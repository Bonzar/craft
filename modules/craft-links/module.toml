# Связи «Зависит от» и «Следующий шаг» между задачами, этапами и вехами: когда
# связь ставится, с каких сторон, куда ведёт ссылка, как с ней живёт /ждет. Часть
# skill, без хука. Связь не сущность: тега и шаблона у неё нет, data/entity.json
# нет. Читать его велят скиллы задачи и этапа. data/review-criterion.md —
# проверка связей для ревью хода, поэтому `for` только у ревью.
slug = "craft-links"
for = ["turn-review"]
# Механику вызовов и место содержимого тоггла берёт из craft-call, форму
# разговора и подагента без контекста — из behavior.
requires = ["craft-call", "behavior"]
