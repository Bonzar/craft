# Якорь сессии: задача или тема в базе Craft, к которой относится сессия. Модуль
# пишет выбор якоря в объём ревью и привозит критерий «у сессии есть якорь».
slug = "craft-session-anchor"
for = ["turn-review"]
events = ["prompt", "post-tool"]
# Ревью он не требует: объём дописывается механизмом хранилища ядра, по
# контракту из README turn-review.
requires = []
# У рутины якоря нет и быть не может: без человека модуль не ставится, и ревью
# хода в рутине критерия «у сессии есть якорь» не получает.
autonomous = false
