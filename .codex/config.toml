# Ранние хуки Desktop. Этот файл versioned, поэтому Codex читает его до Local
# Environment setup и до первого хода. Команды не ссылаются на сгенерированную
# установку: они исполняют исходники ровно текущего worktree.

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 tools/jarvis-project-hook --module craft-sync --harness codex --event session-start"
timeout = 1800

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 tools/jarvis-project-hook --module shell-tree --harness codex --event session-start"
timeout = 1800

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 tools/jarvis-project-hook --module start-context-codex --harness codex --event session-start --event after-compact"
timeout = 1800
additionalContextLimit = 0
