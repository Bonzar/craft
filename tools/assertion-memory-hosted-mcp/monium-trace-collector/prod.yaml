receivers:
  otlp/lane:
    protocols:
      http:
        endpoint: 127.0.0.1:24318

processors:
  filter/lane:
    error_mode: propagate
    trace_conditions:
      - 'resource.attributes["service.name"] != "assertion-memory-prod"'
      - 'resource.attributes["deployment.environment.name"] != "prod"'
