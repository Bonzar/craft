name: Assertion Memory Visual PR
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assertion-memory-visual-pr.yml"
      - ".github/workflows/assertion-memory-visual.yml"
      - ".github/workflows/assertion-memory-native-visual.yml"
      - "tools/assertion-memory-visual/**"
      - "tools/assertion-memory-release/release_core.py"
      - "tools/assertion-memory-release/ssh_transport.py"
      - "tools/assertion-memory-release/receipt_proof.py"
permissions: {}
jobs:
  build:
    if: github.repository == 'Bonzar/craft'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -B tools/assertion-memory-visual/test_asset_origin.py
          PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/test_common_transport_adapter.py
          PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/test_visual_policy.py
          python3 -B tools/assertion-memory-visual/test_lifecycle.py
          PYTHONPATH=tools/assertion-memory-release:tools/assertion-memory-release/experimental python3 -B tools/assertion-memory-visual/test_configured_visual_replay.py
          python3 -B tools/assertion-memory-visual/native_visual_test.py
          node --test tools/assertion-memory-visual/sites-shell.test.mjs tools/assertion-memory-visual/test_overlay.mjs tools/assertion-memory-visual/test_queue_dashboard.mjs
          mkdir "$RUNNER_TEMP/visual"
          node tools/assertion-memory-visual/build-archive.mjs tools/assertion-memory-visual "$RUNNER_TEMP/visual/visual.tar" > "$RUNNER_TEMP/build-receipt.json"
          PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/visual_assemble.py "$RUNNER_TEMP/visual/visual.tar" "$RUNNER_TEMP/build-receipt.json"
          VISUAL_SEED_PATH="$RUNNER_TEMP/visual/visual.tar" VISUAL_SEED_RECEIPT="$RUNNER_TEMP/build-receipt.json" PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/test_with_release_core.py
