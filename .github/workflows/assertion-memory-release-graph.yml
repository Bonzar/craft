name: Assertion Memory · Release graph
on:
  workflow_run:
    workflows: ["Assertion Memory Base Release", "Assertion Memory Visual Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published immutable base or visual version tag
        type: string
        required: true
      deploy_base_test:
        description: Request TEST deployment of the existing base tag (approval required)
        type: boolean
        default: false
      deploy_visual:
        description: Request TEST then separate PROD approval for the existing visual tag
        type: boolean
        default: false
permissions: {}
run-name: "Release graph · ${{ inputs.tag || github.event.workflow_run.head_branch || 'offline checks' }} "
jobs:
  release:
    name: Verify release and original build
    if: github.repository == 'Bonzar/craft' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      revision: ${{ steps.resolve.outputs.revision }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      archive_sha: ${{ steps.resolve.outputs.archive_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: resolve
        name: Resolve immutable version tag without numeric IDs
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_TAG: ${{ inputs.tag }}
        run: python3 tools/assertion-memory-release/github_graph_preview.py resolve
  test:
    name: Verify exact release bytes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      verified_sha: ${{ steps.verify.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: verify
        name: Hash the same original archived build (no activation or smoke)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          ARCHIVE_SHA: ${{ needs.release.outputs.archive_sha }}
        run: python3 tools/assertion-memory-release/github_graph_preview.py hash
  prod:
    name: PROD preview · same artifact, no deploy
    needs: [release, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare TEST-preview hash (no environment or credentials)
        env:
          ARCHIVE_SHA: ${{ needs.release.outputs.archive_sha }}
          VERIFIED_SHA: ${{ needs.test.outputs.verified_sha }}
        run: python3 tools/assertion-memory-release/github_graph_preview.py compare

  native-base-test:
    name: Deploy base TEST · original immutable archive
    needs: [release, test]
    if: (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.deploy_base_test && !inputs.deploy_visual)) && github.ref_protected && vars.ASSERTION_MEMORY_NATIVE_BASE_TEST == 'true' && startsWith(needs.release.outputs.tag, 'assertion-memory-v') && !startsWith(needs.release.outputs.tag, 'assertion-memory-visual-')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    environment: assertion-memory-native-base-test
    permissions:
      contents: read
      actions: read
    concurrency:
      group: assertion-memory-deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: "3.12"
      - id: resolve
        name: Download and verify the exact immutable build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TEST_ENV_ID: ${{ vars.ASSERTION_MEMORY_NATIVE_BASE_TEST_ENV_ID }}
          NATIVE_TEST_REVIEWER_ID: ${{ vars.ASSERTION_MEMORY_NATIVE_BASE_TEST_REVIEWER_ID }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          GRAPH_RELEASE_ID: ${{ needs.release.outputs.release_id }}
          GRAPH_TAG: ${{ needs.release.outputs.tag }}
          GRAPH_REVISION: ${{ needs.release.outputs.revision }}
          GRAPH_ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
          GRAPH_BUILD_RUN_ID: ${{ needs.release.outputs.build_run_id }}
          GRAPH_ARCHIVE_SHA: ${{ needs.release.outputs.archive_sha }}
          GRAPH_VERIFIED_SHA: ${{ needs.test.outputs.verified_sha }}
          NATIVE_TEST_ENV_READY: ${{ vars.ASSERTION_MEMORY_NATIVE_BASE_TEST_ENV_READY }}
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-payload
        run: python tools/assertion-memory-qa/lifecycle.py native-test
      - id: send
        name: Activate and smoke-check via pinned restricted connection
        env:
          GRAPH_TAG: ${{ needs.release.outputs.tag }}
          NATIVE_TEST_ENV_READY: ${{ vars.ASSERTION_MEMORY_NATIVE_BASE_TEST_ENV_READY }}
          RELEASE_ENABLED: ${{ vars.ASSERTION_MEMORY_DEPLOY_ENABLED }}
          RELEASE_USER: ${{ vars.ASSERTION_MEMORY_SSH_USER }}
          RELEASE_HOST: ${{ vars.ASSERTION_MEMORY_SSH_HOST }}
          RELEASE_PORT: ${{ vars.ASSERTION_MEMORY_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.ASSERTION_MEMORY_DEPLOY_KEY }}
          SSH_HOST_PIN: ${{ secrets.ASSERTION_MEMORY_SSH_HOST_PIN }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          RELEASE_REVISION: ${{ steps.resolve.outputs.revision }}
          RELEASE_ARCHIVE_SHA256: ${{ steps.resolve.outputs.release_sha256 }}
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-payload
        run: tools/assertion-memory-qa/send-release.sh test

      - name: Preserve native TEST evidence (not accepted by legacy PROD)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assertion-memory-native-base-test-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/assertion-memory-payload/identity.json
            ${{ runner.temp }}/assertion-memory-payload/receiver-receipt.json
          if-no-files-found: error
          retention-days: 90

  native-visual-test:
    name: Deploy visual TEST
    needs: [release, test]
    if: ((github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/assertion-memory-visual.yml') || (github.event_name == 'workflow_dispatch' && inputs.deploy_visual && !inputs.deploy_base_test)) && github.ref_protected && vars.ASSERTION_MEMORY_NATIVE_VISUAL == 'true' && startsWith(needs.release.outputs.tag, 'assertion-memory-visual-v')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/assertion-memory-native-visual.yml
    # Environment-only secrets need named mappings at the reusable call site.
    secrets:
      ASSERTION_MEMORY_NATIVE_VISUAL_HOST_PIN: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_HOST_PIN }}
      ASSERTION_MEMORY_NATIVE_VISUAL_SSH_KEY: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_SSH_KEY }}
      ASSERTION_MEMORY_NATIVE_VISUAL_SIGNING_KEY: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_SIGNING_KEY }}
      ASSERTION_MEMORY_NATIVE_VISUAL_GATEWAY_TOKEN: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_GATEWAY_TOKEN }}
    with:
      stage: test
      tag: ${{ needs.release.outputs.tag }}
      revision: ${{ needs.release.outputs.revision }}
      release_id: ${{ needs.release.outputs.release_id }}
      build_run_id: ${{ needs.release.outputs.build_run_id }}
      artifact_id: ${{ needs.release.outputs.artifact_id }}
      archive_sha: ${{ needs.release.outputs.archive_sha }}
      verified_sha: ${{ needs.test.outputs.verified_sha }}

  native-visual-prod:
    name: Promote exact visual TEST to PROD
    needs: [release, test, native-visual-test]
    if: ((github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/assertion-memory-visual.yml') || (github.event_name == 'workflow_dispatch' && inputs.deploy_visual && !inputs.deploy_base_test)) && github.ref_protected && vars.ASSERTION_MEMORY_NATIVE_VISUAL == 'true' && needs.native-visual-test.result == 'success' && needs.native-visual-test.outputs.test_proof != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/assertion-memory-native-visual.yml
    # Environment-only secrets need named mappings at the reusable call site.
    secrets:
      ASSERTION_MEMORY_NATIVE_VISUAL_HOST_PIN: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_HOST_PIN }}
      ASSERTION_MEMORY_NATIVE_VISUAL_SSH_KEY: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_SSH_KEY }}
      ASSERTION_MEMORY_NATIVE_VISUAL_SIGNING_KEY: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_SIGNING_KEY }}
      ASSERTION_MEMORY_NATIVE_VISUAL_GATEWAY_TOKEN: ${{ secrets.ASSERTION_MEMORY_NATIVE_VISUAL_GATEWAY_TOKEN }}
    with:
      stage: prod
      tag: ${{ needs.release.outputs.tag }}
      revision: ${{ needs.release.outputs.revision }}
      release_id: ${{ needs.release.outputs.release_id }}
      build_run_id: ${{ needs.release.outputs.build_run_id }}
      artifact_id: ${{ needs.release.outputs.artifact_id }}
      archive_sha: ${{ needs.release.outputs.archive_sha }}
      verified_sha: ${{ needs.test.outputs.verified_sha }}
      test_proof: ${{ needs.native-visual-test.outputs.test_proof }}
