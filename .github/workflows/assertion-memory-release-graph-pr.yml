name: Assertion Memory Release Graph PR
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/assertion-memory-release-graph-pr.yml"
      - ".github/workflows/assertion-memory-release-graph.yml"
      - ".github/workflows/assertion-memory-native-visual.yml"
      - "tools/assertion-memory-visual/native_visual*.py"
      - "tools/assertion-memory-release/github_graph_preview*"
      - "tools/assertion-memory-release/native_test_policy.py"
      - "tools/assertion-memory-release/release_core.py"
      - "tools/assertion-memory-release/test_release_post_commit.py"
      - "tools/assertion-memory-release/*retention*.py"
      - "tools/assertion-memory-release/retention-systemd/**"
      - "tools/assertion-memory-qa/test_native_test_policy.py"
      - "tools/assertion-memory-qa/lifecycle.py"
      - "tools/assertion-memory-qa/send_test_release.py"
permissions: {}
jobs:
  preview-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/assertion-memory-release/github_graph_preview_test.py
      - run: python3 tools/assertion-memory-qa/test_native_test_policy.py
      - run: python3 tools/assertion-memory-release/test_release_post_commit.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: "3.12"
      - name: Test current-only generated release retention
        run: |
          export PYTHONPATH=tools/assertion-memory-release:tools/assertion-memory-visual
          python3 -m unittest discover -s tools/assertion-memory-release -p '*retention*.py'
