name: Configured release proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/configured-release-proof.yml"
      - ".github/workflows/configured-release-proof-reusable.yml"

permissions: {}
jobs:
  proof:
    if: github.repository == 'Bonzar/craft'
    uses: ./.github/workflows/configured-release-proof-reusable.yml
    with:
      profile: synthetic
