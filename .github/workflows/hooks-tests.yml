name: hooks-tests

# Регресс-тесты слоя хуков Claude Code (.claude/hooks/) и чистых кусков JS-инструментов.
# Детерминированно, без сети и моделей — реальный Craft не трогается. Слой и раннер на
# node; jq остался нужен установщику и части тестовых скриптов. См. tests/README.md.
on:
  push:
  pull_request:

jobs:
  hooks-tests:
    runs-on: ubuntu-latest
    # Та же локаль, в которой хуки исполняются на рабочей машине. Часть дефектов
    # видна только в UTF-8: подстановка `$var` вплотную к не-ASCII символу в ней
    # читается как имя вместе с символом и валит скрипт, а в локали C проходит.
    # Раннер тестов выставляет её и сам — здесь для остальных шагов и наглядности.
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: jq --version || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Make hooks executable
        run: chmod +x .claude/hooks/*.js

      - name: Run hook regression tests
        run: node tests/run.js

      # Ядро слоя (чтение события, ответы, пути состояния, уступка второму вызову)
      # проверяется юнит-тестами: кейсы гоняют хуки целиком и разъехавшийся модуль
      # ловят только там, где он уже кому-то сломал ответ.
      - name: Core unit tests
        run: node --test tests/unit/*.test.mjs

      - name: Install.sh idempotency smoke
        run: bash tests/install-smoke.sh

      # Раннер кейсов видит только stdout хука. Что синк системы делает С ГИТОМ —
      # сдвинулся ли HEAD, цела ли несохранённая работа, откачен ли конфликт —
      # проверяется отдельным тестом на временных репозиториях, без сети.
      - name: System sync git logic
        run: bash tests/sync-system-git.sh

      # Решение по ключу пульта капчи. Сам пульт живёт на маке и тянет playwright
      # маковским путём — здесь гоняется только вынесенная из него чистая функция.
      - name: Capgate outcome test
        run: node tools/mac/capgate-outcome.test.js

      # Bash не создаёт переменную с не-ASCII именем: присваивание падает «command not
      # found», и защита молча перестаёт работать. «bash -n» этого не видит.
      - name: Shell identifiers are ASCII
        run: bash tests/shell-identifiers.sh

      # У ожидания человека не бывает срока: таймер делает «ещё не пришёл» неотличимым
      # от «отказал».
      - name: Human wait is unbounded
        run: bash tests/human-wait-unbounded.sh

      # Тело заявки в пульт капчи: спецсимволы остаются данными, негодные поля не уходят.
      - name: Claim body is encoded and validated
        run: bash tools/mac/claim-body.test.sh

      # Адрес открытой страницы не должен выполнять команды на маке. Тест исполняет то, что
      # ушло бы удалённой оболочке, ровно как это сделал бы sshd, и ищет файл-улику.
      - name: Page URL cannot execute commands over ssh
        run: bash tools/mac/h-shell-injection.test.sh

      # Узел сети ждут, а не смотрят однажды: карта сети приходит с задержкой, и мгновенный
      # снимок не отличает спящий ноут от ещё не доехавшей карты.
      - name: Tunnel waits for the node before giving a verdict
        run: bash tools/mac/node-ready.test.sh

      # Ядро грейдера евалов гоняется на записанных потоках: без сети и моделей,
      # поэтому живёт в том же CI, что и хук-тесты. См. evals/README.md.
      - name: Eval grader selftest
        run: bash evals/selftest.sh

      # Раннер евалов на подставном прогоне: параллельность, целостность отчёта
      # и страница хода — без моделей и сети, за десяток секунд.
      - name: Eval runner smoke (no models)
        run: bash evals/fake-run.sh

      # Разбор ответов классификатора: положительная форма сидит подстрокой в
      # отрицательной, и перепутанный порядок сверки даёт ровно обратный вердикт.
      # Гоняется с заглушкой вместо модели — без сети. Пока тест не стоял в
      # прогоне, он тихо сгнил на снесённых режимах и никто этого не видел.
      - name: Classifier answer parsing
        run: bash tools/plan-scope-classifier-test.sh
