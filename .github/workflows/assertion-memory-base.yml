name: Assertion Memory Base Release

on:
  pull_request:
    paths:
      - ".github/workflows/assertion-memory-base.yml"
      - "prototypes/assertion_memory/**"
      - "apps/graph_viewer/**"
      - "tools/assertion-memory-qa/**"
      - "tools/assertion-memory-release/**"
      - "tests/test_model_*.py"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: 'Explicit deployment action; production requires a green TEST run receipt'
        type: choice
        options: [test, production]
        default: test
        required: true
      release_id:
        description: 'Numeric ID of the published assertion-memory GitHub Release'
        type: string
        required: true

      test_run_id:
        description: 'For production only: successful TEST run ID from this same main commit'
        type: string
        required: false

permissions: {}

run-name: "Assertion memory • ${{ inputs.action || github.event_name }} • release ${{ inputs.release_id || github.event.release.id }}"

jobs:
  build:
    if: github.repository == 'Bonzar/craft' && (github.event_name == 'pull_request' || (github.event_name == 'release' && github.run_attempt == '1' && startsWith(github.ref, 'refs/tags/assertion-memory-v') && !startsWith(github.ref, 'refs/tags/assertion-memory-visual-')))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      zip_sha256: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - if: github.event_name == 'release'
        name: Verify published immutable release and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: python tools/assertion-memory-qa/lifecycle.py build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install pinned lexical-only QA requirements
        shell: bash
        run: |
          grep -v '^fastembed==' apps/graph_viewer/requirements.txt > "$RUNNER_TEMP/graph-lexical.txt"
          python -m pip install --disable-pip-version-check --only-binary=:all: -r prototypes/assertion_memory/requirements-mcp.txt -r "$RUNNER_TEMP/graph-lexical.txt"
      - name: Build and test graph frontend
        working-directory: apps/graph_viewer
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Test documented offline Python memory contracts
        run: |
          python -m unittest \
            prototypes.assertion_memory.tests.test_thought_store \
            tests.test_thought_service \
            tests.test_thought_provider_contract \
            prototypes.assertion_memory.native_intake_test \
            prototypes.assertion_memory.desktop_fast_test \
            prototypes.assertion_memory.tests.test_manual_release \
            prototypes.assertion_memory.tests.test_backup_recovery \
            prototypes.assertion_memory.tests.test_codex_availability \
            prototypes.assertion_memory.tests.test_thought_search_boundary \
            prototypes.assertion_memory.tests.test_source_lifecycle_boundary \
            prototypes.assertion_memory.tests.test_thought_processing_selection \
            prototypes.assertion_memory.tests.test_thought_worker \
            tests.test_model_profile_replay \
            tests.test_model_review_routing
      - name: Test fictional database, graph and authenticated MCP
        shell: bash
        run: |
          export PYTHONPATH="$PWD"
          python tools/assertion-memory-qa/synthetic_fixture.py "$RUNNER_TEMP/memory-fictional.sqlite3"
          python tools/assertion-memory-qa/smoke_local.py "$RUNNER_TEMP/memory-fictional.sqlite3"
      - name: Test release/approval fail-closed checks
        run: |
          python tools/assertion-memory-qa/test-release-ci.py
          python tools/assertion-memory-qa/test-lifecycle.py
          python tools/assertion-memory-qa/test-promotion.py
      - name: Test shared receiver and scoped adapter recovery
        run: |
          bash -n tools/assertion-memory-qa/vm/provision-test.sh
          bash -n tools/assertion-memory-release/adopt-live-base-test.sh
          python tools/assertion-memory-release/test_adopt_live_base_test.py
          python -m unittest discover -s tools/assertion-memory-qa/vm -p test_receiver.py
          PYTHONPATH=tools/assertion-memory-release python -m unittest discover -s tools/assertion-memory-qa/prod-bridge
      - name: Build narrow, data-free release
        run: tools/assertion-memory-qa/build-release.sh "$RUNNER_TEMP/qa-release"
      - if: github.event_name == 'release'
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assertion-memory-base-release-${{ github.event.release.id }}-${{ github.sha }}
          path: ${{ runner.temp }}/qa-release/*
          if-no-files-found: error
          retention-days: 90
  deploy-test:
    name: Deploy TEST
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'test' && github.repository == 'Bonzar/craft' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && vars.ASSERTION_MEMORY_BASE_DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    environment: assertion-memory-test
    permissions:
      contents: read
      actions: read
    concurrency:
      group: assertion-memory-deploy-test
      cancel-in-progress: false
    outputs:
      revision: ${{ steps.send.outputs.revision }}
      sha256: ${{ steps.send.outputs.sha256 }}
      artifact_id: ${{ steps.send.outputs.artifact_id }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: "3.12"
      - id: resolve
        name: Download and verify the exact immutable build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-payload
        run: python tools/assertion-memory-qa/lifecycle.py test
      - id: send
        name: Activate and smoke-check via pinned restricted connection
        env:
          RELEASE_ENABLED: ${{ vars.ASSERTION_MEMORY_DEPLOY_ENABLED }}
          RELEASE_USER: ${{ vars.ASSERTION_MEMORY_SSH_USER }}
          RELEASE_HOST: ${{ vars.ASSERTION_MEMORY_SSH_HOST }}
          RELEASE_PORT: ${{ vars.ASSERTION_MEMORY_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.ASSERTION_MEMORY_DEPLOY_KEY }}
          SSH_HOST_PIN: ${{ secrets.ASSERTION_MEMORY_SSH_HOST_PIN }}
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          RELEASE_REVISION: ${{ steps.resolve.outputs.revision }}
          RELEASE_ARCHIVE_SHA256: ${{ steps.resolve.outputs.release_sha256 }}
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-payload
        run: tools/assertion-memory-qa/send-release.sh test

      - name: Record exact activated TEST identity
        env:
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-payload
        run: python tools/assertion-memory-qa/lifecycle.py receipt
      - name: Persist verified TEST receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assertion-memory-test-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assertion-memory-payload/test-receipt.json
          if-no-files-found: error
          retention-days: 90
  deploy-production:
    name: Promote exact TEST archive to PROD
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'production' && inputs.test_run_id != '' && github.repository == 'Bonzar/craft' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.ref_protected && vars.ASSERTION_MEMORY_PROD_BRIDGE_CALLER_READY == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Bonzar/craft/.github/workflows/assertion-memory-authorize-promotion.yml@a3afb72811483ddef20eb6371213e64bf9505424
    with:
      release_id: ${{ inputs.release_id }}
      test_run_id: ${{ inputs.test_run_id }}
    secrets:
      ASSERTION_MEMORY_DEPLOY_KEY: ${{ secrets.ASSERTION_MEMORY_DEPLOY_KEY }}
      ASSERTION_MEMORY_SSH_HOST_PIN: ${{ secrets.ASSERTION_MEMORY_SSH_HOST_PIN }}
