name: Build Sites MCP Bridge Release
on:
  release:
    types: [published]
permissions: {}
jobs:
  package:
    if: github.repository == 'Bonzar/craft' && github.run_attempt == '1' && startsWith(github.ref, 'refs/tags/assertion-memory-sites-v')
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.canonical.outputs.release_id }}
      revision: ${{ steps.canonical.outputs.revision }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      archive_sha256: ${{ steps.artifact.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - id: canonical
        name: Verify published immutable Sites bridge release and exact main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=tools/assertion-memory-qa python3 -B - <<'PYVERIFY'
          import json,os,re,subprocess,sys
          sys.path.insert(0,'tools/assertion-memory-qa')
          from lifecycle import ci
          env=os.environ
          event=json.load(open(env['GITHUB_EVENT_PATH'],encoding='utf-8'))
          release=event.get('release') or {}
          tag,rev,rid=env['GITHUB_REF_NAME'],env['GITHUB_SHA'],release.get('id')
          if (event.get('action')!='published' or type(rid) is not int or not 0<rid<10**20
              or not re.fullmatch(r'assertion-memory-sites-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]{1,30})?',tag)
              or not re.fullmatch(r'[0-9a-f]{40}',rev) or env['GITHUB_REF']!='refs/tags/'+tag
              or release.get('tag_name')!=tag):
              raise SystemExit('Unexpected GitHub release event')
          remote=ci.api(f'/repos/Bonzar/craft/releases/{rid}')
          if (remote.get('id')!=rid or remote.get('tag_name')!=tag or remote.get('draft') is not False
              or remote.get('immutable') is not True or not remote.get('published_at')):
              raise SystemExit('The selected GitHub release is not published and immutable')
          local=subprocess.check_output(['git','rev-parse','--verify','refs/tags/'+tag+'^{commit}'],text=True).strip()
          if local!=rev:
              raise SystemExit('GitHub event and tag do not identify the same commit')
          subprocess.run(['git','merge-base','--is-ancestor',rev,'refs/remotes/origin/main'],check=True)
          with open(env['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'release_id={rid}\nrevision={rev}\n')
          PYVERIFY
      - name: Verify thin recorder and bundle entry points
        working-directory: tools/assertion-memory-hosted-mcp/sites-dynamic
        run: |
          node --test test_worker.mjs
          python3 -B -m unittest test_release_package
      - name: Build one immutable two-profile bridge bundle
        env:
          TEST_PROJECT_HASH: ${{ vars.MEMORY_TEST_SITE_PROJECT_SHA256 }}
          TEST_ORIGIN_HASH: ${{ vars.MEMORY_TEST_SITE_ORIGIN_SHA256 }}
          TEST_ACL_HASH: ${{ vars.MEMORY_TEST_SITE_ACCESS_SHA256 }}
          PROD_PROJECT_HASH: ${{ vars.MEMORY_PROD_SITE_PROJECT_SHA256 }}
          PROD_ORIGIN_HASH: ${{ vars.MEMORY_PROD_SITE_ORIGIN_SHA256 }}
          PROD_ACL_HASH: ${{ vars.MEMORY_PROD_SITE_ACCESS_SHA256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/sites-bridge-release"
          python3 -B - <<'PY'
          import json,os,pathlib,re
          for lane in ('test','prod'):
              args=lane.upper()
              names=[args+'_'+key for key in ('PROJECT_HASH','ORIGIN_HASH','ACL_HASH')]
              if not all(re.fullmatch(r'[0-9a-f]{64}',os.environ.get(key,'')) for key in names):
                  raise SystemExit('Missing verified Sites scope fields: '+','.join(names))
              p=pathlib.Path(os.environ['RUNNER_TEMP'])/(lane+'.json')
              p.write_text(json.dumps({'lane':lane,'owner_only':True,'include_effects':True,
                 'effects_timeout_ms':8000,'project_id_sha256':os.environ[args+'_PROJECT_HASH'],
                 'site_origin_sha256':os.environ[args+'_ORIGIN_HASH'],
                 'access_identity_sha256':os.environ[args+'_ACL_HASH']}))
          PY
          base="tools/assertion-memory-hosted-mcp/sites-dynamic"
          python3 -B "$base/package_release.py" --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" \
            --worker "$base/worker.mjs" --test-profile "$RUNNER_TEMP/test.json" --prod-profile "$RUNNER_TEMP/prod.json" \
            --output "$RUNNER_TEMP/sites-bridge-release/source.tar.gz" > "$RUNNER_TEMP/sites-bridge-release/build-evidence.json"
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sites-mcp-bridge-${{ steps.canonical.outputs.release_id }}-${{ steps.canonical.outputs.revision }}
          path: ${{ runner.temp }}/sites-bridge-release/
          if-no-files-found: error
