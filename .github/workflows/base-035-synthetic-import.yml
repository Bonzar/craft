name: Base .35 synthetic OCI import qualification
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: base-035-synthetic-oci-import
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.repository == 'Bonzar/craft'
          && github.ref == 'refs/heads/main'
          && github.ref_protected
          && github.run_attempt == '1' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-tags: false
          fetch-depth: 1
      - name: Revalidate and stage fixed public OCI
        working-directory: tools/assertion-memory-release/rollback-input-review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 "$RUNNER_TEMP/base035-qualification"
          work="$RUNNER_TEMP/base035-qualification"
          mkdir -m 700 "$work/public"
          python3 -B materialize_035_public_runtime.py "$work/public"
          python3 -B stage_035_oci_layout.py stage "$work/public/oci-blobs" \
            "$work/public/native-libraries/native-library-layer.tar" "$work/oci"
      - name: Import fixed OCI from local layout and run fixed sandbox probe
        working-directory: tools/assertion-memory-release/rollback-input-review
        shell: bash
        run: |
          set -euo pipefail
          bash hosted_035_import_local_oci.sh "$RUNNER_TEMP/base035-qualification/oci"
      - name: Purge only this ephemeral qualification
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/base035-qualification"
