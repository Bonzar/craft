# Reusable bridge source only. The base caller is connected in a second,
# independently reviewed commit pinning the exact commit that owns this file.
name: Authorize immutable base production activation
on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      test_run_id:
        required: true
        type: string
    secrets:
      ASSERTION_MEMORY_DEPLOY_KEY:
        required: true
      ASSERTION_MEMORY_SSH_HOST_PIN:
        required: true
permissions: {}
jobs:
  deploy-production:
    if: github.repository == 'Bonzar/craft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: assertion-memory-production
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: assertion-memory-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: "3.12"
      - name: Verify audited producer and exact green TEST archive
        shell: bash
        env:
          AUDITED_REUSABLE_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_READY: ${{ vars.ASSERTION_MEMORY_PROD_READY }}
          RELEASE_ID: ${{ inputs.release_id }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-production
        run: |
          test "$(git rev-parse HEAD)" = "$AUDITED_REUSABLE_SHA"
          PYTHONPATH=tools/assertion-memory-qa python tools/assertion-memory-qa/prod-bridge/verify_producer_job.py
          python tools/assertion-memory-qa/lifecycle.py production-pinned-proof
      - name: Activate exact authorized archive through pinned PROD connection
        env:
          AUDITED_REUSABLE_SHA: ${{ job.workflow_sha }}
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/assertion-memory-production
          RELEASE_ENABLED: ${{ vars.ASSERTION_MEMORY_PROD_READY }}
          RELEASE_HOST: ${{ vars.ASSERTION_MEMORY_SSH_HOST }}
          RELEASE_PORT: ${{ vars.ASSERTION_MEMORY_SSH_PORT }}
          PROD_VM_ID: ${{ vars.ASSERTION_MEMORY_PROD_VM_ID }}
          PROD_ENVIRONMENT_NODE_ID: ${{ vars.ASSERTION_MEMORY_PROD_ENVIRONMENT_NODE_ID }}
          PROD_OIDC_SUBJECT: ${{ vars.ASSERTION_MEMORY_PROD_OIDC_SUBJECT }}
          SSH_PRIVATE_KEY: ${{ secrets.ASSERTION_MEMORY_DEPLOY_KEY }}
          SSH_HOST_PIN: ${{ secrets.ASSERTION_MEMORY_SSH_HOST_PIN }}
        run: python tools/assertion-memory-qa/prod-bridge/prod_runner.py
