name: Assertion Memory Visual Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [test, prod]
        required: true
      release_id:
        type: string
        description: ID of the published immutable visual release
        required: true
      test_run_id:
        type: string
        description: Successful visual TEST run ID (PROD only)
permissions: {}
jobs:
  build:
    if: github.repository == 'Bonzar/craft' && github.event_name == 'release' && github.run_attempt == '1' && startsWith(github.ref, 'refs/tags/assertion-memory-visual-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_RELEASE_ID: ${{ github.event.release.id }}
        run: python3 -B tools/assertion-memory-visual/lifecycle.py build
      - run: |
          python3 -B tools/assertion-memory-visual/test_asset_origin.py
          PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/test_common_transport_adapter.py
          PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/test_visual_policy.py
          python3 -B tools/assertion-memory-visual/test_lifecycle.py
          python3 -B tools/assertion-memory-visual/native_visual_test.py
          node --test tools/assertion-memory-visual/sites-shell.test.mjs tools/assertion-memory-visual/test_overlay.mjs tools/assertion-memory-visual/test_queue_dashboard.mjs
          mkdir "$RUNNER_TEMP/visual"
          node tools/assertion-memory-visual/build-archive.mjs tools/assertion-memory-visual "$RUNNER_TEMP/visual/visual.tar" > "$RUNNER_TEMP/build-receipt.json"
          PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/visual_assemble.py "$RUNNER_TEMP/visual/visual.tar" "$RUNNER_TEMP/build-receipt.json"
          GITHUB_EVENT_NAME=pull_request node tools/assertion-memory-visual/build-archive.mjs tools/assertion-memory-visual "$RUNNER_TEMP/untagged.tar" > "$RUNNER_TEMP/untagged-receipt.json"
          VISUAL_SEED_PATH="$RUNNER_TEMP/untagged.tar" VISUAL_SEED_RECEIPT="$RUNNER_TEMP/untagged-receipt.json" PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/test_with_release_core.py
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); input=json.loads((root/'build-receipt.json').read_bytes())
          receipt=dict(source_commit=os.environ['GITHUB_SHA'],archive_sha256=input['archive_sha256'],
                       archive_bytes=input['bytes'],release_digest=input['release'])
          (root/'visual/receipt.json').write_text(json.dumps(receipt))
          PY
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assertion-memory-visual-${{ github.event.release.id }}-${{ github.sha }}
          path: "${{ runner.temp }}/visual/*"
          if-no-files-found: error
          retention-days: 90
  deploy:
    name: Deploy visual ${{ inputs.action == 'test' && 'TEST' || 'PROD' }}
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Bonzar/craft' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && (inputs.action == 'test' || inputs.action == 'prod')
    environment: assertion-memory-visual-${{ inputs.action }}
    runs-on: ubuntu-latest
    concurrency:
      group: assertion-memory-visual-${{ inputs.action }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      VISUAL_ENV: ${{ inputs.action }}
      VISUAL_RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          ACTOR_ID: ${{ github.actor_id }}
          AUTHORIZED_ID: ${{ vars.VISUAL_DEPLOY_ACTOR_ID }}
        run: |
          [[ "$AUTHORIZED_ID" =~ ^[1-9][0-9]*$ && "$ACTOR_ID" == "$AUTHORIZED_ID" ]]
          echo "VISUAL_DOWNLOAD=$RUNNER_TEMP/visual" >> "$GITHUB_ENV"
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_TEST_RUN_ID: ${{ inputs.test_run_id }}
        run: python3 -B tools/assertion-memory-visual/lifecycle.py "$VISUAL_ENV"
      - name: Activate exact visual archive
        env:
          VISUAL_REVISION: ${{ steps.artifact.outputs.revision }}
          VISUAL_SHA: ${{ steps.artifact.outputs.sha256 }}
          VISUAL_DIGEST: ${{ steps.artifact.outputs.release }}
          VISUAL_DEPLOY_ENABLED: ${{ vars.VISUAL_DEPLOY_ENABLED }}
          VISUAL_HOST: ${{ vars.VISUAL_HOST }}
          VISUAL_PORT: ${{ vars.VISUAL_PORT }}
          VISUAL_SSH_KEY: ${{ secrets.VISUAL_SSH_KEY }}
          VISUAL_SIGNING_KEY: ${{ secrets.VISUAL_SIGNING_KEY }}
          VISUAL_HOST_PIN: ${{ secrets.VISUAL_HOST_PIN }}
        run: PYTHONPATH=tools/assertion-memory-release python3 -B tools/assertion-memory-visual/visual_send.py
      - name: Smoke exact visual ingress
        env:
          VISUAL_DIGEST: ${{ steps.artifact.outputs.release }}
          VISUAL_GATEWAY_HOST: ${{ vars.VISUAL_GATEWAY_HOST }}
          VISUAL_GATEWAY_TOKEN: ${{ secrets.VISUAL_GATEWAY_TOKEN }}
        run: python3 -B tools/assertion-memory-visual/smoke.py
      - if: inputs.action == 'test'
        env:
          VISUAL_REVISION: ${{ steps.artifact.outputs.revision }}
          VISUAL_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          VISUAL_SHA: ${{ steps.artifact.outputs.sha256 }}
          VISUAL_DIGEST: ${{ steps.artifact.outputs.release }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          d=os.environ
          receipt=dict(revision=d['VISUAL_REVISION'],artifact_id=d['VISUAL_ARTIFACT_ID'],sha256=d['VISUAL_SHA'],
                       release=d['VISUAL_DIGEST'],test_run_id=d['GITHUB_RUN_ID'],release_id=d['VISUAL_RELEASE_ID'],workflow_sha=d['GITHUB_SHA'])
          (pathlib.Path(d['RUNNER_TEMP'])/'test-proof.json').write_text(json.dumps(receipt))
          PY
      - name: Persist verified visual TEST receipt
        if: inputs.action == 'test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-test-proof-${{ github.run_id }}
          path: "${{ runner.temp }}/test-proof.json"
          if-no-files-found: error
          retention-days: 90
