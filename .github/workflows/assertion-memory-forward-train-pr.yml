name: Assertion Memory Forward Train Contract
on:
  pull_request:
    paths:
      - 'tools/assertion-memory-release/*forward_release*.py'
      - '.github/workflows/assertion-memory-forward-train-pr.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - name: Test independent TEST/PROD admission and supersession
        working-directory: tools/assertion-memory-release
        run: python3 -B -m unittest test_forward_release_train test_forward_release_checkpoints test_forward_release_receiver
